 }).filter(p=>p.id>0).slice(0,3);

function eggRarity(eggIndex,id){

}

 if([144,145,146].includes(id))return 'でんせつの さんちょうチャレンジで しょうり';if(id===150)return 'グリーンに かったあと ミュウツーに しょうり';if(id===151)return 'ミュウいがいの 150しゅるいを ずかんに とうろく';if(eventMap[id])return eventMap[id];

 }catch{let target=$('#dex-data');if(target)target.innerHTML='<p class="muted">くわしくデータを取得できなかったよ。通信状況をかくにんしてね。</p>'}

function eff(m,def){return def.types.reduce((a,t)=>a*(CHART[m.type]?.[t]??1),1)}
const STAGE_KEYS=['attack','defense','special-attack','special-defense','speed','accuracy','evasion'];
const STAGE_LABELS={'attack':'こうげき','defense':'ぼうぎょ','special-attack':'とくこう','special-defense':'とくぼう','speed':'すばやさ','accuracy':'命中率','evasion':'回避率'};

function stageMultiplier(rank,accuracy=false){rank=Math.max(-6,Math.min(6,rank));let base=accuracy?3:2;return rank>=0?(base+rank)/base:base/(base-rank)}
function effectiveStat(p,key){return Math.max(1,p.stats[key]*stageMultiplier(ensureStages(p)[key]))}
function hitChance(att,def,m){let a=ensureStages(att).accuracy,d=ensureStages(def).evasion;return Math.max(0,Math.min(100,(m.accuracy??100)*stageMultiplier(a-d,true)))}

 let effects=[STAGE_EFFECTS[slug],...(EXTRA_STAGE_EFFECTS[slug]||[])];
 if(!effects[0])return false;
 battle.log.push(`${att.name}の ${moveName}！`);
 for(const [stat,delta,self] of effects){
  let target=self?att:def,stages=ensureStages(target),before=stages[stat];
  stages[stat]=Math.max(-6,Math.min(6,before+delta));
  let diff=stages[stat]-before;
  if(!diff){battle.log.push(`${target.name}の${STAGE_LABELS[stat]}は もう${delta>0?'上がらない':'下がらない'}！`);continue}
  battle.log.push(`${target.name}の${STAGE_LABELS[stat]}が${Math.abs(diff)>=2?'ぐーんと':''}${diff>0?'上がった':'下がった'}！`);
 }

}
function damage(att,def,m){

function applyStatusMove(att,def,m){

 if(slug==='leech-seed'){if(def.types.includes('grass')||def.seeded){battle.log.push('しかし うまく きまらなかった！')}else{def.seeded=true;battle.log.push(`${def.name}に タネを うえた！`)}return true}
 const status=['sleep-powder','hypnosis','spore'].includes(slug)?'sleep':['stun-spore','thunder-wave'].includes(slug)?'paralysis':'poison';
 if(def.status||status==='poison'&&def.types.some(t=>['poison','steel'].includes(t))||status==='paralysis'&&def.types.includes('electric')){battle.log.push('しかし こうかが なかった！');return true}
 def.status=status;def.statusTurns=status==='sleep'?2+Math.floor(Math.random()*2):0;

function canAct(p){if(p.status==='sleep'){p.statusTurns--;if(p.statusTurns>0){battle.log.push(`${p.name}は ねむっている…`);return false}p.status=null;battle.log.push(`${p.name}は めを さました！`)}if(p.status==='paralysis'&&Math.random()<.25){battle.log.push(`${p.name}は まひして うごけない！`);return false}return true}
function endTurnEffects(){for(const p of [activeMon('allies'),activeMon('enemies')]){if(!p||p.hp<=0)continue;if(p.status==='poison'){const n=Math.max(1,Math.floor(p.maxHp/8));p.hp=Math.max(0,p.hp-n);battle.log.push(`${p.name}は どくで ${n}ダメージ！`)}if(p.seeded&&p.hp>0){const n=Math.max(1,Math.floor(p.maxHp/8));p.hp=Math.max(0,p.hp-n);const other=p===activeMon('allies')?activeMon('enemies'):activeMon('allies');if(other&&other.hp>0)other.hp=Math.min(other.maxHp,other.hp+n);battle.log.push(`${p.name}は やどりぎで ${n}HP すいとられた！`)}}}
function attack(att,def,m){
 if(!canAct(att))return;
 if(Math.random()*100>=hitChance(att,def,m)){battle.log.push(`${att.name}の ${m.name}！ しかし外れた！`);return}
 if(m.category==='status'){
  if(applyStatusMove(att,def,m))return;
  if(applyStage(att,def,m.slug,m.name))return;

 let mult=eff(m,def);
 if(mult===0){battle.log.push(`${att.name}の ${m.name}！ 効果がない…`);return}
 let n=damage(att,def,m);def.hp=Math.max(0,def.hp-n);
 battle.log.push(`${att.name}の ${m.name}！ ${n}ダメージ！${mult>1?' 効果はバツグン！':mult<1?' 効果はいまひとつ…':''}`);
 if(def.hp===0)battle.log.push(`${def.name}は倒れた！`)
}
function battleSpeed(p){return effectiveStat(p,'speed')}
function resetStages(p){p.stages=Object.fromEntries(STAGE_KEYS.map(k=>[k,0]))}
function nextAlive(arr){return arr.findIndex(p=>p.hp>0)}
function endCheck(){if(activeMon('enemies').hp<=0){let n=nextAlive(battle.enemies);if(n<0){winBattle();return true}battle.ei=n;resetStages(activeMon('enemies'));battle.log.push(`${battle.boss.name}は ${activeMon('enemies').name}をくりだした！`)}if(activeMon('allies').hp<=0){let n=nextAlive(battle.allies);if(n<0){loseBattle();return true}battle.ai=n;resetStages(activeMon('allies'));battle.log.push(`${state.player}は ${activeMon('allies').name}をくりだした！`)}return false}
async function playerAttack(i){
 if(!battle||battle.busy)return;
 const b=battle,a=activeMon('allies'),e=activeMon('enemies'),m=a.moves[i];if(!m)return;
 b.busy=true;render();
 const em=e.moves[Math.floor(Math.random()*e.moves.length)];
 const first=battleSpeed(a)>battleSpeed(e)||(battleSpeed(a)===battleSpeed(e)&&Math.random()<.5);
 const order=first?[[a,e,m],[e,a,em]]:[[e,a,em],[a,e,m]];
 for(const [att,def,move] of order){
  if(battle!==b)return;
  if(att.hp<=0||def.hp<=0)break;
  await animatedAttack(att,def,move,b);
  if(await animatedSwitchCheck(b))return;
  // ひんし・交代が起きたターンは次の攻撃を行わない
  if(activeMon('allies')!==a||activeMon('enemies')!==e)break;
 }
 if(battle===b)await animatedTurnEnd(b);
}
async function switchPoke(i){
 if(!battle||battle.busy||battle.allies[i]?.hp<=0||i===battle.ai)return;
 const b=battle;b.busy=true;resetStages(activeMon('allies'));b.ai=i;
 b.log.push(`${state.player}は ${activeMon('allies').name}に こうたいした！`);render();
 battleMessage(`いけ！ ${activeMon('allies').name}！`);playBattleCry(activeMon('allies'));await battleWait(950);
 if(battle!==b)return;
 const e=activeMon('enemies'),a=activeMon('allies');await animatedAttack(e,a,e.moves[Math.floor(Math.random()*e.moves.length)],b);
 if(await animatedSwitchCheck(b))return;
 await animatedTurnEnd(b);
}
function retreat(){if(!confirm('バトルをやめる？ ペナルティはないよ。'))return;battleSequence++;battle=null;render()}
function winBattle(){if(battle.extra){winExtraBattle();return}let b=battle.boss,idx=state.cleared;state.cleared++;state.energy+=b.lv*10;save();battle=null;tab='story';render();showModal(`<h2>🏆 ${b.name}に勝利！</h2>${gymDialogueCard(idx,'after')}<div class="badge-win-art">${badgeSvg(idx)}</div><p><b>${b.badge}</b>を手に入れた！<br>かつと もらえる：${b.lv*10} ポケエネ！</p><div class="notice">放置収益が <b>${INCOME[idx]} → ${INCOME[idx+1]} エネ/時</b> にアップ！<br>${EGG[idx+1]?.name||'つぎのぼうけん'}がかいほうされた！</div><button class="btn wide" style="margin-top:13px" onclick="closeModal()">つぎのぼうけんへ！</button>`)}
function loseBattle(){const b=battle.boss;const legend=!!battle.extra&&LEGEND_BOSSES.some(x=>x.key===b.key);const reward=legend?legendLoseReward(b):Math.floor(b.lv*10/2);state.energy+=reward;save();battle=null;tab='story';render();showModal(`<h2>また ちょうせんしよう！</h2><p>${esc(b.name)}には まけてしまった…。<br>でも がんばった ごほうび！</p><div class="notice"><b>✨ ${reward} ポケエネ ゲット！</b><br>${legend?'まけても なんどでも もらえるよ！':'しょうりボーナスの はんぶんを もらったよ！'}</div><p>あと すこしで かてそう！ ポケモンを そだてて また ちょうせんしよう！</p><button class="btn wide" onclick="closeModal()">いくせいにもどる</button>`)}
window.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t)changeTab(t.dataset.tab)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!battle)render()});window.addEventListener('focus',()=>{if(!battle&&state.step>=3)render()});render();
</script>
