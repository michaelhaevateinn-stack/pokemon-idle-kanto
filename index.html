function finishHoennGift(id){
 const scene=hoennGiftScene;if(!scene||scene.state!==state||!isHoenn())return;
 const e=HD.gifts[scene.i];if(!hoennGiftAvailable(e)||scene.step<(e.lines?.length||0))return;

 const existing=own(id);if(existing)existing.lv=Math.max(existing.lv,e.lv);else add(id,e.lv,false);
 state.events[hoennGiftFlag(e)]=true;hoennGiftScene=null;save();render();
 showModal(`<h2>🎁 なかまに なった！</h2>${rewardPortraits([own(id)])}<p class="reward-caption">${esc(name(id))} Lv.${e.lv}</p><button class="btn gold wide" onclick="closeModal()">やったー！</button>`);
}
function hoennDexAcquisition(id){
 const routes=[];
 const unlockHint=e=>{
  const hints=[];
  if(e.afterBoss)hints.push(e.afterBoss+'に かったあと');
  else if(e.after>0)hints.push((HD.gyms[e.after-1]?.name||`${e.after}こめの ジム`)+'に かったあと');
  if(e.afterChampion)hints.push('でんどういりの あと');
  if(e.afterSpecial)hints.push((HOENN_SPECIAL.find(x=>x.key===e.afterSpecial)?.name||'とくべつバトル')+'に かったあと');
  if(e.afterDex)hints.push('ほかの ホウエンずかん '+e.afterDex+'しゅるいを とうろく');
  return hints.length?'（'+hints.join('・')+'）':'';
 };
 if(HD.starters.some(x=>x.id===id))routes.push('オダマキはかせから さいしょに えらぶ／ごさんけプレゼント');
 HD.eggs.forEach((e,i)=>{if(e.ids.includes(id))routes.push(e.name+'から ふか'+(i!==0?'（'+(HD.gyms[i-1]?.name||'ジム')+'の あと）':''))});
 for(const e of HD.gifts.filter(x=>x.id===id))routes.push((e.where||e.name)+'で うけとる'+unlockHint(e));
 for(const e of HOENN_SPECIAL.filter(x=>(x.recruitIds||[x.id||x.team[0]]).includes(id)))routes.push(e.name+'に しょうり'+unlockHint(e));
 for(const [from,e] of Object.entries(HOENN_EVOLUTIONS)){
  if(e[0]!==id)continue;
  const parent=name(Number(from));
  routes.push(e[2]?`${parent}に ${STONE[e[2]]||'どうぐ'}を つかって しんか`:`${parent}を Lv.${e[1]}にして しんか`);
 }
 return [...new Set(routes)].join('／')||'この バージョンでは にゅうしゅほうほうが まだ せっていされていないよ';
}

function hoennMoveSelection(learned,stored){

  if(learned.some(m=>m.slug===slug)&&!selected.includes(slug))selected.push(slug);

  const type=fallback?.[1]||hoennMoveData(slug)?.type;
  if(!type)continue;
  const target=fallback?[45,65,90][Number(fallback[2])]:Number(hoennMoveData(slug)?.power)||0;
  const equivalent=learned.filter(m=>m.type===type&&!selected.includes(m.slug)&&(target>0?m.power>0:m.power===0))
   .sort((a,b)=>Math.abs(a.power-target)-Math.abs(b.power-target)||b.level-a.level||a.slug.localeCompare(b.slug))[0];
  if(equivalent)selected.push(equivalent.slug);
 }

 return {slugs:selected.slice(0,4),changed:missing.length>0};
}

 if(completed&&completionKey){state.eggCompletionDates=state.eggCompletionDates||{};if(!state.eggCompletionDates[completionKey(i)])state.eggCompletionDates[completionKey(i)]=new Date().toISOString()}
 save();render();

}

function regionMeta(){
 if(!state.regions||typeof state.regions!=='object')state.regions={};

 return state.regions;
}
function regionSnapshot(){const {regions,activeRegion,admin,...part}=state;return JSON.parse(JSON.stringify(part))}
// v6.66: 旧バージョンではポケエネと放置時刻が地方共通だった。
// 旧残高はカントー側に保全し、ジョウトには独立した初期残高を用意する。
// 移行はメモリ上のみで実施し、既存Firebase保存先や形式(version:1)は維持する。
function ensureRegionWallets(){
 const r=state.regions||(state.regions={});
 if(r.walletsMigrated)return false;
 const oldEnergy=Number.isFinite(Number(state.energy))?Number(state.energy):100;
 const oldLast=Number.isFinite(Number(state.last))?Number(state.last):Date.now();
 const active=activeRegionKey();
 if(active==='johto'){
  r.johtoSave=r.johtoSave||regionSnapshot();
  r.johtoSave.energy=100;
  r.johtoSave.last=Date.now();
  r.kantoSave=r.kantoSave||{};
  r.kantoSave.energy=oldEnergy;
  r.kantoSave.last=oldLast;
  state.energy=100;state.last=Date.now();
 }else if(active==='kanto'){
  state.energy=oldEnergy;state.last=oldLast;
  if(r.kantoSave){r.kantoSave.energy=oldEnergy;r.kantoSave.last=oldLast}
  if(r.johtoSave){r.johtoSave.energy=100;r.johtoSave.last=Date.now()}
 }
 r.walletsMigrated=true;
 return true;
}

 if(!['kanto','johto','hoenn'].includes(which))return;

 earn(true);

 if(old===which){tab='home';render();if(which==='hoenn'&&!state.starter)showHoennProfessor();return}
 r[old+'Save']=regionSnapshot();
 if(which==='johto'&&!r.johtoSave){
  const freshJ=fresh();freshJ.player=state.player;freshJ.step=3;freshJ.energy=100;freshJ.events={};
  r.johtoSave=Object.fromEntries(Object.entries(freshJ).filter(([k])=>k!=='admin'));
 }
 if(which==='hoenn'&&!r.hoennSave)r.hoennSave=hoennNewSave();
 const snapshot=r[which+'Save'];
 const admin=state.admin;
 state={...snapshot,regions:r,activeRegion:which,admin};
 if(!Number.isFinite(Number(state.energy)))state.energy=100;
 if(!Number.isFinite(Number(state.last)))state.last=Date.now();
 tab='home';save();render();window.scrollTo(0,0);
 if(which==='johto'&&!state.starter)showJohtoProfessor();
 if(which==='hoenn'&&!state.starter)showHoennProfessor();
}

function evolve(uid,selectedTo=null){
 if(evolutionBusy)return;
 let p=byUid(uid),e=regionEvolutionTable()[p?.id];if(!e)return;
 if(p.id===133){
   if(![134,135,136].includes(selectedTo))return toast('しんかさきを えらんでね');
   const stones={134:'water',135:'thunder',136:'fire'};
   e=[selectedTo,0,stones[selectedTo]];
 }
 let [to,lv,kind]=e;if(lv&&p.lv<lv)return;
 if(own(to))return toast('しんか したあとのポケモンをすでに持っているよ');
 let c=kind?50:0;if(!pay(c))return;
 const from=p.id,old=name(from),next=name(to),shiny=!!p.shiny;
 // 進化しても選択中の技と自動設定をそのまま引き継ぐ。
 // 進化後の技候補には進化前の習得技も含まれる。
 p.id=to;
 state.seen=[...new Set([...state.seen,to])];
 if(shiny)state.shinySeen=[...new Set([...state.shinySeen,to])];
 save();render();preparePoke(to);
 evolutionBusy=true;
 showModal(`<h2>✨ しんかが はじまった！</h2><div class="evolution-stage" id="evolutionStage"><div class="evolution-light"></div><img class="evolution-before" src="${sprite(from,shiny)}" alt="${esc(old)}"><img class="evolution-after" src="${sprite(to,shiny)}" alt="${esc(next)}"><div class="evolution-sparkles">✦ ✨ ✦</div></div><p class="evolution-caption" id="evolutionCaption">おや？ ${esc(old)}の ようすが…！</p><button id="evolutionDone" class="btn wide" onclick="finishEvolution();closeModal()">スキップして とじる</button>`);
 evolutionCry(from);

}

function adminLogin(){
 if(modeSwitching)return;
 if(saveMode==='admin'){
  showModal(`<h2>🏠 いつものぼうけんに もどる</h2><p>テストデータは べつに ほぞんされるよ。</p><button class="btn wide" onclick="closeModal();switchSaveMode('normal')">ほんばんデータに もどる</button><button class="btn alt wide" style="margin-top:8px" onclick="closeModal()">キャンセル</button>`);return;
 }
 showModal(`<h2>🔑 かんりしゃテスト</h2><p>テスト用の べつデータで あそべるよ。ほんばんの ぼうけんには えいきょうしないよ。</p><input id="adminPass" type="password" class="input" placeholder="パスワード"><button class="btn wide" style="margin-top:12px" onclick="checkAdmin()">テストモードを ひらく</button><button class="btn alt wide" style="margin-top:8px" onclick="closeModal()">もどる</button>`)
}
function checkAdmin(){if($('#adminPass').value!=='daiki')return toast('パスワードが違うよ');closeModal();switchSaveMode('admin')}
// Only the current account's existing normal-save wallets can receive a gift.
const ENERGY_GIFT_REGIONS=Object.freeze({
 kanto:Object.freeze({label:'カントー',saveKey:'kantoSave',path:'save.regions.kantoSave.energy'}),
 johto:Object.freeze({label:'ジョウト',saveKey:'johtoSave',path:'save.regions.johtoSave.energy'}),
 hoenn:Object.freeze({label:'ホウエン',saveKey:'hoennSave',path:'save.regions.hoennSave.energy'})
});
const isEnergyGiftRegion=key=>typeof key==='string'&&Object.hasOwn(ENERGY_GIFT_REGIONS,key);
const isEnergyGiftAmount=n=>Number.isSafeInteger(n)&&n>=1&&n<=100000;
function energyGiftTarget(normal,key){
 if(!isEnergyGiftRegion(key)||!normal||normal.version!==1)return {reason:'badSave'};
 const a=normal.activeRegion;
 if(a!=null&&!isEnergyGiftRegion(a))return {reason:'badSave'};
 const active=a??'kanto',meta=ENERGY_GIFT_REGIONS[key],regions=normal.regions;
 const existing=region=>region===active?normal:regions?.[ENERGY_GIFT_REGIONS[region].saveKey];
 const wallet=existing(key);
 if(!wallet){
  const unlocked=key==='kanto'||(key==='johto'?!!existing('kanto')?.hallOfFame:Number(existing('johto')?.johtoStage)>=JOHTO_ORDER.length);
  return {reason:unlocked?'notStarted':'locked'};
 }
 // A legacy Kanto balance remains top-level during wallet migration. Do not credit anything that migration rewrites.
 if(!regions?.walletsMigrated&&(active!=='kanto'||key!==active))return {reason:'legacy'};
 if(wallet.version!==1||!Number.isFinite(wallet.energy)||wallet.energy<0)return {reason:'badSave'};
 return {path:key===active?'save.energy':meta.path,energy:wallet.energy};
}
const energyGiftReason=reason=>({notStarted:'未開始',locked:'未解放',legacy:'本番で開いて保存してね',badSave:'セーブを確認できません'})[reason]||'';
let giftSending=false,giftDraft=null;
const giftSessionActive=session=>!!session&&cloudReady&&!modeSwitching&&saveMode==='admin'&&cloudUser===session.user&&cloudUser?.uid===session.uid;
function cancelAdminGiftEnergy(){if(giftSending)return;giftDraft=null;closeModal()}
async function adminGiftEnergy(){
 if(saveMode!=='admin'||!cloudReady||modeSwitching||giftSending||!cloudUser?.uid)return;
 const session={uid:cloudUser.uid,user:cloudUser,phase:'loading'};
 giftDraft=session;
 showModal('<h2>🎁 ポケエネ プレゼント</h2><p>本番セーブを よみこみちゅう…</p><button class="btn alt wide" onclick="cancelAdminGiftEnergy()">やめる</button>');
 try{
  const normal=await window.firebaseBridge.read('normal');
  if(giftDraft!==session||!giftSessionActive(session))return;
  if(!normal||normal.version!==1){
   showModal('<h2>🎁 ポケエネ プレゼント</h2><p>本番セーブが みつからなかったよ。</p><button class="btn alt wide" onclick="cancelAdminGiftEnergy()">とじる</button>');
   return;
  }
  const entries=Object.entries(ENERGY_GIFT_REGIONS).map(([key,meta])=>[key,meta.label,energyGiftTarget(normal,key)]);
  session.allowed=entries.filter(([, ,v])=>v.path).map(([key])=>key);session.phase='choose';
  const options=entries.map(([key,label,info])=>`<option value="${key}" ${info.path?'':'disabled'}>${esc(label+(info.reason?'（'+energyGiftReason(info.reason)+'）':''))}</option>`).join('');
  showModal(`<h2>🎁 ポケエネ プレゼント</h2><p>大貴の <b>いつものぼうけん（本番）</b>の 送り先を えらんでね。</p><form onsubmit="event.preventDefault();previewAdminGiftEnergy()"><label for="giftRegion">送り先の地方</label><select class="input" id="giftRegion" required><option value="" selected disabled>地方を えらぶ</option>${options}</select><label for="giftAmount" style="display:block;margin-top:12px">ポケエネの数（1〜100,000）</label><input class="input" id="giftAmount" type="number" inputmode="numeric" min="1" max="100000" step="1" value="100" required><p class="small">未開始・未解放の地方には 送れないよ。古いセーブは いつものぼうけんで 開いて保存してね。</p><button class="btn gold wide" ${session.allowed.length?'':'disabled'}>確認へ</button></form><button class="btn alt wide" style="margin-top:8px" onclick="cancelAdminGiftEnergy()">やめる</button>`);
 }catch(error){if(giftDraft===session&&giftSessionActive(session)){console.error(error);cancelAdminGiftEnergy();toast('本番セーブを よみこめなかったよ')}}
}
function previewAdminGiftEnergy(){
 const session=giftDraft;
 if(!giftSessionActive(session)||session.phase!=='choose'||giftSending)return;
 const key=$('#giftRegion').value,amount=Number($('#giftAmount').value);
 if(!isEnergyGiftRegion(key)||!session.allowed.includes(key))return toast('送り先の地方を えらんでね');
 if(!isEnergyGiftAmount(amount))return toast('1〜100000の すうじを いれてね');
 const label=ENERGY_GIFT_REGIONS[key].label,n=amount.toLocaleString('ja-JP');
 Object.assign(session,{key,amount,phase:'confirm'});
 showModal(`<h2>🎁 プレゼントの確認</h2><p>大貴の いつものぼうけん（本番）の <b>${label}</b> に、<b>${n} ポケエネ</b>を おくる？</p><button class="btn gold wide" onclick="sendAdminGiftEnergy()">${label}に おくる</button><button class="btn alt wide" style="margin-top:8px" onclick="cancelAdminGiftEnergy()">やめる</button>`);
}
async function sendAdminGiftEnergy(){
 const session=giftDraft;
 if(!giftSessionActive(session)||session.phase!=='confirm'||giftSending)return;
 const {key,amount}=session,label=ENERGY_GIFT_REGIONS[key].label,n=amount.toLocaleString('ja-JP');
 giftSending=true;session.phase='sending';

function showVictorySwitchPicker(){

 showModal(`<h2>✨ あいての ポケモンを たおした！</h2><p>つぎは ${esc(activeMon('enemies').name)}！<br>ポケモンを こうたいする？</p>${other?`<div class="battle-heal-list">${choices}</div>`:'<p>こうたいできる ポケモンが いないよ。</p>'}<button class="btn alt wide" onclick="chooseVictorySwitch(-1)">このまま たたかう</button>`);
