function confirmStarter(id){state.starter=id;add(id,5,false);state.step=3;save();closeModal();tab='home';render();setTimeout(()=>showModal(`<h2>🏅 めざせ、ポケモンチャンピオン！</h2><p>${esc(state.player)}よ！ 8つのジムバッジを あつめ、ポケモンリーグの チャンピオンを めざすんじゃ！</p><div class="notice"><b>最初の目標：ニビジムのタケシ</b><br>タイプ：いわ ／ 推奨レベル：10<br>相手のポケモンはすべて Lv.10</div><p>まずはポケエネをためて、ポケモンを育ててみよう。ジムにはいつでも挑戦できるぞ！</p><button class="btn wide" onclick="closeModal()">ぼうけんに出発！</button>`),150)}
function renderHome(){let b=BOSSES[Math.min(state.cleared,7)];return `<div class="hero"><div class="muted">⚡ ためて、育てて、チャンピオンへ</div><div style="font-size:35px;font-weight:900;margin:5px 0">${money(state.energy)} <span style="font-size:16px">ポケエネ</span></div><div class="row between"><span>⏱️ ${INCOME[Math.min(state.cleared,8)]} / 時間</span><span>🥚 タマゴ ${EGG[Math.min(state.cleared,8)].price}〜</span></div><div class="muted" style="margin-top:7px">アプリを閉じている間もたまる・上限なし</div></div><div class="card"><h2>🎯 いまの目標</h2>${state.cleared>=8?'<p>8つのバッジを集めた！ 四天王編は次回アップデートで追加予定。</p>':`<div class="row between"><div><h3>${b.city}ジム · ${b.name}</h3><p class="muted">${b.type}タイプ ／ 推奨 Lv.${b.lv}</p><p class="muted">勝利報酬：${b.lv*10}ポケエネ</p></div><span class="badge">🏅</span></div><button class="btn wide" style="margin-top:12px" onclick="changeTab('story')">ジム情報・挑戦へ →</button>`}</div><div class="card"><h2>🐾 パーティー</h2><div class="grid3">${state.team.map(uid=>byUid(uid)).filter(Boolean).map(cardPoke).join('')}${Array.from({length:Math.max(0,3-state.team.length)},()=>'<div class="poke" style="display:grid;place-items:center;min-height:140px;color:#9ab0b7">＋<br>空き</div>').join('')}</div><button class="btn alt wide" style="margin-top:12px" onclick="changeTab('team')">ポケモンを育てる →</button></div><div class="card"><h2>📖 ぼうけんの記録</h2><p class="small">ゲットしたポケモン：${state.seen.length} / 151種</p><p class="small">集めたバッジ：${state.cleared} / 8</p><div class="progress" style="margin-top:10px"><i style="width:${state.cleared/8*100}%"></i></div></div>`}
function changeTab(t){tab=t;render();window.scrollTo(0,0)}
function renderEggs(){let unlock=Math.min(state.cleared,8);return `<div class="card"><h2>🥚 タマゴショップ</h2><p class="muted">新しい街へ進むと、タマゴが増えていくよ。孵化したポケモンは Lv.5。色違い確率は10%。</p><p class="small" style="margin-top:9px"><b>所持：${money(state.energy)} ポケエネ</b></p></div>${EGG.map((e,i)=>`<div class="card ${i>unlock?'locked':''}"><div class="row between"><div><h3>${i===0?'🥚':'🥚'} ${e.name}</h3><p class="muted">${i===0?'はじめから':BOSSES[i-1]?.name+'撃破で解放'} · ${e.ids.length}種類</p></div><span class="tag">${e.price} エネ</span></div><div class="row" style="margin-top:10px;flex-wrap:wrap">${e.ids.map(id=>`<span class="tag">${name(id)}</span>`).join('')}</div><button class="btn ${i>unlock?'alt':''} wide" style="margin-top:12px" ${i>unlock?'disabled':''} onclick="hatch(${i})">${i>unlock?'🔒 まだ解放されていない':'このタマゴを孵化させる'}</button></div>`).join('')}`}
function familyRoot(id){let cur=id,seen=new Set();while(true){let from=Object.keys(EVO).find(k=>EVO[k][0]===cur&&!seen.has(+k));if(!from)return cur;seen.add(+from);cur=+from}}
function hatch(i){if(i>state.cleared)return;let e=EGG[i],avail=e.ids.filter(id=>!state.owned.some(p=>familyRoot(p.id)===familyRoot(id)));if(!avail.length)return toast('このタマゴのポケモンは全種類ゲット済み！');if(!pay(e.price))return;let weights=avail.map(id=>e.weights?.[e.ids.indexOf(id)]||1),sum=weights.reduce((a,b)=>a+b,0),r=Math.random()*sum,id=avail.at(-1);for(let j=0;j<avail.length;j++){r-=weights[j];if(r<0){id=avail[j];break}}let p=add(id);save();render();showModal(`<h2>🥚 タマゴが かえった！</h2><div style="text-align:center">${img(id,p.shiny)}<h2>${name(id)} ${p.shiny?'✨色違い！':''}</h2><p>Lv.5 の ${name(id)} が なかまになった！</p></div><button class="btn wide" onclick="closeModal()">やったー！</button>`)}
function renderTeam(){return `<div class="card"><h2>🐾 ポケモンボックス</h2><p class="muted">タップで育成・技選択。パーティーは最大3匹。育成上限は次のジム推奨Lvの2倍（最大100）。</p><div class="grid3" style="margin-top:12px">${state.owned.map(p=>`<button class="poke ${state.team.includes(p.uid)?'selected':''}" onclick="openPoke('${p.uid}')">${img(p.id,p.shiny)}<div class="name">${name(p.id)}${p.shiny?' ✨':''}</div><div class="tiny">Lv.${p.lv} ${state.team.includes(p.uid)?'●編成中':''}</div></button>`).join('')}</div></div><div class="card"><h2>🎒 パーティー編成</h2><p class="muted">ポケモンの詳細画面で編成・解除できるよ。</p><div class="row" style="flex-wrap:wrap;margin-top:9px">${state.team.map((uid,i)=>`<span class="tag">${i+1}. ${name(byUid(uid)?.id)}</span>`).join('')||'未編成'}</div></div>`}
function levelCap(){return Math.min(100,Math.max(20,(BOSSES[Math.min(state.cleared,7)]?.lv||70)*2))}
function openPoke(uid){let p=byUid(uid);if(!p)return;let evo=EVO[p.id],can=evo&&(evo[1]===0||p.lv>=evo[1]),ec=evo?.[2]==='link'?100:evo?.[2]?50:0;let eText=evo?`${name(evo[0])} ${evo[1]?`Lv.${evo[1]}で進化`:`${STONE[evo[2]]}（${ec}エネ）`}`:'初代ではこれ以上進化しない';showModal(`<h2>${name(p.id)} ${p.shiny?'✨':''}</h2><div class="row">${img(p.id,p.shiny)}<div><b class="level">Lv.${p.lv}</b><p class="muted">レベル上限：${levelCap()}</p><p class="muted">次のLv：${cost(p.lv)}エネ</p></div></div><hr class="separator"><div class="grid2"><button class="btn" ${p.lv>=levelCap()?'disabled':''} onclick="levelUp('${uid}',1)">Lv +1<br><small>${cost(p.lv)}エネ</small></button><button class="btn alt" ${p.lv>=levelCap()?'disabled':''} onclick="levelUp('${uid}',5)">Lv +5まで</button></div><hr class="separator"><p class="small">進化：${eText}</p>${evo?`<button class="btn alt wide" ${can?'':'disabled'} onclick="evolve('${uid}')">${can?'進化させる':'まだ進化できない'}</button>`:''}<hr class="separator"><div class="grid2"><button class="btn alt" onclick="editMoves('${uid}')">⚔️ 技を選ぶ</button><button class="btn ${state.team.includes(uid)?'alt':'dark'}" onclick="toggleTeam('${uid}')">${state.team.includes(uid)?'編成から外す':'パーティーに入れる'}</button></div><button class="btn alt wide" style="margin-top:12px" onclick="closeModal()">閉じる</button>`)}
function levelUp(uid,amount){let p=byUid(uid);if(!p)return;let n=Math.min(amount,levelCap()-p.lv),spent=0,gain=0;for(let i=1;i<=n;i++){let c=cost(p.lv+i-1);if(!state.admin&&state.energy<spent+c)break;spent+=c;gain++}if(!gain)return toast('ポケエネ不足かレベル上限だよ');pay(spent);p.lv+=gain;save();render();openPoke(uid);toast(`${name(p.id)}が Lv.${p.lv} になった！`);preparePoke(p.id)}
function evolve(uid){let p=byUid(uid),e=EVO[p?.id];if(!e)return;let [to,lv,kind]=e;if(lv&&p.lv<lv)return;if(own(to))return toast('進化先のポケモンをすでに持っているよ');let c=kind==='link'?100:kind?50:0;if(!pay(c))return;let old=name(p.id);p.id=to;p.moves=[];p.auto=true;state.seen=[...new Set([...state.seen,to])];save();render();showModal(`<h2>✨ おめでとう！</h2><div style="text-align:center">${img(to,p.shiny)}<p>${old}は ${name(to)} に 進化した！</p></div><button class="btn wide" onclick="closeModal()">やったー！</button>`);preparePoke(to)}
function toggleTeam(uid){if(state.team.includes(uid))state.team=state.team.filter(x=>x!==uid);else if(state.team.length<3)state.team.push(uid);else {let options=state.team.map((id,i)=>`${i+1}: ${name(byUid(id)?.id)}`).join('\n');let v=prompt('誰と交代する？ 番号を入力してね\n'+options);let i=Number(v)-1;if(!Number.isInteger(i)||i<0||i>=state.team.length)return;state.team[i]=uid}save();render();openPoke(uid)}
async function fetchPokemon(id){if(apiCache['p'+id])return apiCache['p'+id];let r=await fetch('https://pokeapi.co/api/v2/pokemon/'+id);if(!r.ok)throw Error('PokéAPIが応答しません');let j=await r.json(),v={stats:Object.fromEntries(j.stats.map(s=>[s.stat.name,s.base_stat])),types:j.types.map(x=>x.type.name),moves:j.moves.map(x=>({slug:x.move.name,details:x.version_group_details}))};apiCache['p'+id]=v;cacheSave();return v}
async function fetchMove(slug){if(apiCache['m'+slug])return apiCache['m'+slug];let r=await fetch('https://pokeapi.co/api/v2/move/'+slug);if(!r.ok)throw Error('技データを取得できません');let j=await r.json(),m={slug,name:j.names.find(x=>x.language.name==='ja-Hrkt')?.name||j.names.find(x=>x.language.name==='ja')?.name||slug,type:j.type.name,power:j.power||0,accuracy:j.accuracy??100,category:j.damage_class.name,priority:j.priority||0};apiCache['m'+slug]=m;cacheSave();return m}
function cacheSave(){try{localStorage.setItem(CACHE,JSON.stringify(apiCache))}catch{}}
async function preparePoke(id){try{await fetchPokemon(id)}catch{}}
function availableSlugs(data,lv){let versions=['lets-go-pikachu-lets-go-eevee','firered-leafgreen','yellow','red-blue'];for(let v of versions){let all=data.moves.map(x=>{let ds=x.details.filter(d=>d.move_learn_method.name==='level-up'&&d.version_group.name===v&&d.level_learned_at<=lv);return ds.length?{slug:x.slug,level:Math.min(...ds.map(d=>d.level_learned_at))}:null}).filter(Boolean);if(all.some(x=>x.slug==='ember')||all.length>=3)return all;}return data.moves.map(x=>{let ds=x.details.filter(d=>d.move_learn_method.name==='level-up'&&d.level_learned_at<=lv);return ds.length?{slug:x.slug,level:Math.min(...ds.map(d=>d.level_learned_at))}:null}).filter(Boolean)}
const STAGE_EFFECTS={
'growl':['attack',-1,false],'tail-whip':['defense',-1,false],
'leer':['defense',-1,false],'smokescreen':['accuracy',-1,false],
'sand-attack':['accuracy',-1,false],'screech':['defense',-2,false],
'string-shot':['speed',-2,false],'defense-curl':['defense',1,true],
'harden':['defense',1,true],'withdraw':['defense',1,true],
'agility':['speed',2,true],'swords-dance':['attack',2,true],
'iron-defense':['defense',2,true],'amnesia':['special-defense',2,true],
'barrier':['defense',2,true],'meditate':['attack',1,true],
'growth':['attack',1,true],'calm-mind':['special-attack',1,true],
'nasty-plot':['special-attack',2,true],'bulk-up':['attack',1,true],
'howl':['attack',1,true],'sharpen':['attack',1,true],
'minimize':['evasion',2,true],'double-team':['evasion',1,true],
'kinesis':['accuracy',-1,false],'flash':['accuracy',-1,false],
'feather-dance':['attack',-2,false],'charm':['attack',-2,false],
'fake-tears':['special-defense',-2,false],'metal-sound':['special-defense',-2,false],
'cotton-spore':['speed',-2,false],'scary-face':['speed',-2,false],
'tickle':['attack',-1,false],'tail-glow':['special-attack',3,true]
};
const EXTRA_STAGE_EFFECTS={'growth':[['special-attack',1,true]],'calm-mind':[['special-defense',1,true]],'bulk-up':[['defense',1,true]],'tickle':[['defense',-1,false]]};
const STATUS_SUPPORTED=new Set(Object.keys(STAGE_EFFECTS));function isSupported(m){return (m.power>0&&['physical','special'].includes(m.category))||STATUS_SUPPORTED.has(m.slug)}
async function learnable(id,lv){let data=await fetchPokemon(id),slugs=availableSlugs(data,lv),moves=await Promise.all(slugs.map(async x=>{try{return {...await fetchMove(x.slug),level:x.level}}catch{return null}}));return moves.filter(x=>x&&isSupported(x)).sort((a,b)=>a.level-b.level||a.name.localeCompare(b.name,'ja'))}
async function editMoves(uid){let p=byUid(uid);if(!p)return;showModal(`<h2>⚔️ ${name(p.id)}の技</h2><p>レベルアップで覚える攻撃技を読み込み中…</p>`);try{let moves=await learnable(p.id,p.lv);if(!byUid(uid))return;window._moveList=moves;window._moveUid=uid;window._moveSelected=(p.moves||[]).filter(s=>moves.some(m=>m.slug===s));if(!window._moveSelected.length)window._moveSelected=moves.slice(-4).map(m=>m.slug);renderMovePicker()}catch(e){showModal(`<h2>通信エラー</h2><p>技データを取得できませんでした。ネット接続を確認して再度試してね。</p><button class="btn wide" onclick="closeModal()">閉じる</button>`)}}
function renderMovePicker(){let p=byUid(window._moveUid),moves=window._moveList||[],selected=window._moveSelected||[];showModal(`<h2>⚔️ ${name(p.id)} Lv.${p.lv}</h2><p class="muted">使いたい技を最大4つ選ぼう。対応済みの補助技も選べるよ。未対応の技は表示対象外。${moves.length?'':'まだ使える習得技が見つかりません。バトルでは仮の基本技を使用します。'}</p><div class="stack" style="margin-top:12px">${moves.map(m=>`<button class="choose ${selected.includes(m.slug)?'on':''}" onclick="toggleMove('${m.slug}')"><div class="row between"><b>${selected.includes(m.slug)?'✓ ':''}${esc(m.name)}</b><span class="tag">${TYPE_JP[m.type]||m.type}</span></div><div class="muted">Lv.${m.level} ／ 威力 ${m.power||'—'} ／ ${m.category==='status'?'補助':m.category==='physical'?'物理':'特殊'}</div></button>`).join('')}</div><p class="small" style="margin:12px 0">選択：${selected.length}/4</p><button class="btn wide" onclick="saveMoves()">この技で決定</button><button class="btn alt wide" style="margin-top:8px" onclick="openPoke('${p.uid}')">戻る</button>`)}
function toggleMove(slug){let a=window._moveSelected||[];if(a.includes(slug))window._moveSelected=a.filter(x=>x!==slug);else if(a.length<4)window._moveSelected=[...a,slug];else return toast('技は4つまで！');renderMovePicker()}
function saveMoves(){let p=byUid(window._moveUid);if(!p)return;p.moves=[...window._moveSelected];p.auto=false;save();toast('技を保存したよ');openPoke(p.uid)}
function renderStory(){let i=state.cleared,b=BOSSES[Math.min(i,7)];return `<div class="card"><h2>🏅 ジムバッジ</h2><div class="grid2">${BOSSES.map((x,j)=>`<div class="stat ${j<i?'':'locked'}">${j<i?'🏅':'◯'} ${x.badge}<div class="muted">${x.city} · ${x.name}</div></div>`).join('')}</div></div>${i>=8?'<div class="card"><h2>🎉 8つのバッジをゲット！</h2><p>四天王編は次回のアップデートで追加する予定だよ。</p></div>':`<div class="card"><div class="tag">第${i+1}ジム</div><h2 style="margin-top:8px">${b.city}ジム · ${b.name}</h2><p class="small">得意タイプ：<b>${b.type}</b></p><p class="small">推奨レベル：<b>Lv.${b.lv}</b>（敵全員同じレベル）</p><p class="small">勝利報酬：<b>${b.lv*10} ポケエネ</b></p><div class="grid3" style="margin-top:13px">${b.team.map(id=>`<div class="poke">${img(id)}<div class="name">${name(id)}</div><div class="tiny">Lv.${b.lv}</div></div>`).join('')}</div><div class="notice" style="margin:12px 0">挑戦条件なし。1〜3匹で挑めるよ！ 負けてもペナルティなし。</div><button class="btn gold wide" onclick="startBattle()">⚔️ ${b.name}に挑戦！</button></div>`}<div class="card"><h2>📍 特別イベント</h2>${renderEvents()}</div>`}
function eventButton(id,title,detail,available,done){return `<div class="listline"><div class="row between"><div><b>${title}</b><div class="muted">${detail}</div></div><button class="btn sm ${done?'alt':''}" ${!available||done?'disabled':''} onclick="runEvent('${id}')">${done?'受取済':available?'受け取る':'🔒'}</button></div></div>`}
function renderEvents(){let i=state.cleared,ev=state.events;return `${eventButton('magikarp','コイキング','タケシ撃破後・おつきみやま',i>=1,!!ev.magikarp)}${eventButton('bulbasaur','フシギダネ','タケシ撃破後・ハナダへの道',i>=1,!!ev.bulbasaur)}${eventButton('charmander','ヒトカゲ','カスミ撃破後',i>=2,!!ev.charmander)}${eventButton('squirtle','ゼニガメ','マチス撃破後',i>=3,!!ev.squirtle)}${eventButton('eevee','イーブイ3匹','エリカ撃破後・タマムシ',i>=4,!!ev.eevee)}${eventButton('porygon','ポリゴン','エリカ撃破後・ゲームコーナー',i>=4,!!ev.porygon)}${eventButton('snorlax','カビゴン Lv.30','エリカ撃破後・特別バトル（次回）',false,!!ev.snorlax)}${eventButton('lapras','ラプラス','ナツメ撃破後・シルフカンパニー',i>=6,!!ev.lapras)}${eventButton('fossils','化石ポケモン','カツラ撃破後・復元イベント（次回）',false,!!ev.fossils)}`}
function runEvent(key){let ids={magikarp:[129],bulbasaur:[1],charmander:[4],squirtle:[7],eevee:[133,133,133],porygon:[137],lapras:[131]}[key];if(!ids||state.events[key])return;let got=[];if(key==='eevee'){let existing=state.owned.filter(p=>p.id===133).length;for(let j=existing;j<3;j++){let p={uid:Date.now()+'-'+j+'-'+Math.random(),id:133,lv:5,shiny:false,moves:[],auto:true};state.owned.push(p);got.push(p);if(state.team.length<3)state.team.push(p.uid)}state.seen=[...new Set([...state.seen,133])]}else{for(let id of ids){let p=add(id,5,false);if(p)got.push(p)}}state.events[key]=true;save();render();showModal(`<h2>🎁 特別な出会い！</h2><p>${got.length?got.map(p=>name(p.id)).join('・')+'が仲間になった！':'すでに仲間にいるので受け取り済みにしたよ。'}</p><div class="row" style="justify-content:center">${got.slice(0,3).map(p=>img(p.id)).join('')}</div><button class="btn wide" onclick="closeModal()">ありがとう！</button>`)}
function renderSettings(){return `<div class="card"><h2>⚙️ 設定</h2><p>プレイヤー：<b>${esc(state.player)}</b></p><p>保存：この端末のブラウザ内（localStorage）</p><p class="muted">Firebase同期は今後追加。現段階では別端末との同期やブラウザデータ消去からの復元はできません。</p><hr class="separator"><button class="btn alt wide" onclick="adminLogin()">🔑 管理者モード：${state.admin?'ON':'OFF'}</button><hr class="separator"><button class="btn alt wide" onclick="exportSave()">💾 セーブデータを書き出す</button><button class="btn alt wide" style="margin-top:8px" onclick="importSave()">📂 セーブデータを読み込む</button><hr class="separator"><button class="btn alt wide" onclick="resetGame()">最初からやり直す</button></div><div class="card"><h2>📝 更新履歴（v0.4）</h2><p class="muted">能力ランク±6段階、命中・回避、交代時のランクリセット、補助技の追加に対応。v0.3では技の選択肢拡大・パーティー交代・初期化パスワードを追加。バトルDX風UI、オーキド博士の立ち絵（外部画像）、オープニング、名前・御三家選択、放置収益、地域タマゴ、レベル育成、初代進化、API攻撃技選択、簡易3対3ジム戦、基本イベントを搭載。</p><p class="muted">既存バトルDX v4.9.3のトレーナー編成を参照。戦闘は今回の育成レベルに対応した簡易版で、DXの全演出・特殊効果・補助技はまだ移植していません。</p></div>`}
function adminLogin(){if(state.admin){state.admin=false;save();render();return}showModal(`<h2>🔑 管理者モード</h2><p>パスワードを入力してね。</p><input id="adminPass" type="password" class="input" placeholder="パスワード"><button class="btn wide" style="margin-top:12px" onclick="checkAdmin()">認証する</button><button class="btn alt wide" style="margin-top:8px" onclick="closeModal()">戻る</button>`)}
function checkAdmin(){if($('#adminPass').value!=='daiki')return toast('パスワードが違うよ');state.admin=true;save();closeModal();render();toast('管理者モード ON：ポケエネ無制限')}
function exportSave(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='kanto_save_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}
function importSave(){showModal(`<h2>📂 セーブ読み込み</h2><p>この端末のセーブを上書きするよ。</p><input type="file" id="saveFile" accept=".json,application/json"><button class="btn wide" style="margin-top:12px" onclick="loadSaveFile()">読み込む</button><button class="btn alt wide" style="margin-top:8px" onclick="closeModal()">キャンセル</button>`)}
async function loadSaveFile(){let f=$('#saveFile').files[0];if(!f)return toast('ファイルを選んでね');try{let j=JSON.parse(await f.text());if(j.version!==1||!Array.isArray(j.owned)||!Array.isArray(j.team)||!Number.isFinite(j.energy)||typeof j.player!=='string')throw Error();state=j;state.last=Date.now();save();closeModal();render();toast('セーブデータを読み込んだよ')}catch{toast('対応するセーブデータではありません')}}
function resetGame(){if(prompt('最初からやり直すにはパスワードを入力してね')!=='daiki'){toast('パスワードが違うよ');return}if(!confirm('本当に最初からやり直す？ セーブが消えるよ。'))return;state=fresh();save();tab='home';render()}
function fallbackMove(types){let type=types?.[0]||'normal',f=FALLBACK[type]||FALLBACK.normal;return {slug:'fallback-'+type,name:f[0],type,power:f[1],category:f[2],accuracy:100}}
function statsFor(data,lv){let s=data?.stats||{'hp':55,'attack':55,'defense':55,'special-attack':55,'special-defense':55,'speed':55};let result={};for(let k of ['hp','attack','defense','special-attack','special-defense','speed'])result[k]=k==='hp'?Math.floor(2*s[k]*lv/100)+lv+10:Math.floor(2*s[k]*lv/100)+5;return result}
async function fighter(id,lv,uid=null){let data;try{data=await fetchPokemon(id)}catch{data={types:['normal'],stats:null,moves:[]}}let p=uid?byUid(uid):null,moves=[];if(p){try{let learned=await learnable(id,lv),slugs=p.auto?learned.slice(-4).map(m=>m.slug):p.moves;moves=slugs.map(s=>learned.find(m=>m.slug===s)).filter(Boolean)}catch{}}else{try{moves=(await learnable(id,lv)).slice(-4)}catch{}}if(!moves.length)moves=[fallbackMove(data.types)];let s=statsFor(data,lv);return {id,uid,lv,shiny:p?.shiny||false,name:name(id),types:data.types||['normal'],stats:s,hp:s.hp,maxHp:s.hp,moves,alive:true,stages:Object.fromEntries(STAGE_KEYS.map(k=>[k,0]))}}
async function startBattle(){if(!state.team.length)return toast('パーティーに1匹は入れてね');if(state.cleared>=8)return;let b=BOSSES[state.cleared];showModal(`<h2>⚔️ ${b.name}に挑戦！</h2><p>ポケモンたちが準備しているよ…</p>`);try{let allies=await Promise.all(state.team.map(uid=>byUid(uid)).filter(Boolean).map(p=>fighter(p.id,p.lv,p.uid))),enemies=await Promise.all(b.team.map(id=>fighter(id,b.lv)));battle={allies,enemies,ai:0,ei:0,turn:1,boss:b,log:[`${b.name}が勝負をしかけてきた！`],busy:false};closeModal();render()}catch(e){closeModal();toast('バトルの準備に失敗したよ')}}
function activeMon(side){return battle?.[side][battle[side==='allies'?'ai':'ei']]}
function hpHtml(p){return `<div class="progress"><i style="width:${Math.max(0,100*p.hp/p.maxHp)}%;background:${p.hp/p.maxHp<.25?'#d95a55':'#31b39b'}"></i></div><div class="muted">HP ${Math.max(0,p.hp)} / ${p.maxHp}</div>`}
function renderBattle(){let b=battle,a=activeMon('allies'),e=activeMon('enemies');return `<header class="top"><h1>⚔️ ${b.boss.name}戦</h1><span class="tag">ターン ${b.turn}</span></header><div class="card"><div class="battlemon enemy">${img(e.id)}<div><b>${e.name} Lv.${e.lv}</b><div class="muted">${b.boss.name}のポケモン ${b.ei+1}/${b.enemies.length}</div>${hpHtml(e)}</div></div><div class="battlemon ally">${img(a.id,a.shiny)}<div><b>${a.name} Lv.${a.lv}</b><div class="muted">${state.player}のポケモン</div>${hpHtml(a)}</div></div><div class="log" id="battleLog">${b.log.slice(-7).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><div class="card"><h2>技を選ぼう！</h2><div class="grid2">${a.moves.map((m,i)=>`<button class="move" ${b.busy?'disabled':''} onclick="playerAttack(${i})"><b>${esc(m.name)}</b><small>${TYPE_JP[m.type]||m.type} · ${m.power?'威力'+m.power:'補助技'}</small></button>`).join('')}</div><hr class="separator"><h3>ポケモンを交代</h3><div class="grid3" style="margin-top:9px">${b.allies.map((p,i)=>`<button class="poke ${i===b.ai?'selected':''} ${p.hp<=0?'locked':''}" ${p.hp<=0||i===b.ai||b.busy?'disabled':''} onclick="switchPoke(${i})">${img(p.id,p.shiny)}<div class="name">${p.name}</div><div class="tiny">HP ${p.hp}</div></button>`).join('')}</div><button class="btn alt wide" style="margin-top:13px" onclick="retreat()">バトルをやめる（ペナルティなし）</button></div>`}
function eff(m,def){return def.types.reduce((a,t)=>a*(CHART[m.type]?.[t]??1),1)}
const STAGE_KEYS=['attack','defense','special-attack','special-defense','speed','accuracy','evasion'];
const STAGE_LABELS={'attack':'攻撃','defense':'防御','special-attack':'特攻','special-defense':'特防','speed':'素早さ','accuracy':'命中率','evasion':'回避率'};
function ensureStages(p){if(!p.stages)p.stages={};for(const k of STAGE_KEYS)if(!Number.isFinite(p.stages[k]))p.stages[k]=0;return p.stages}
function stageMultiplier(rank,accuracy=false){rank=Math.max(-6,Math.min(6,rank));let base=accuracy?3:2;return rank>=0?(base+rank)/base:base/(base-rank)}
function effectiveStat(p,key){return Math.max(1,p.stats[key]*stageMultiplier(ensureStages(p)[key]))}
function hitChance(att,def,m){let a=ensureStages(att).accuracy,d=ensureStages(def).evasion;return Math.max(0,Math.min(100,(m.accuracy??100)*stageMultiplier(a-d,true)))}
function applyStage(att,def,slug,moveName){
 let effects=[STAGE_EFFECTS[slug],...(EXTRA_STAGE_EFFECTS[slug]||[])];
 if(!effects[0])return false;
 battle.log.push(`${att.name}の ${moveName}！`);
 for(const [stat,delta,self] of effects){
  let target=self?att:def,stages=ensureStages(target),before=stages[stat];
  stages[stat]=Math.max(-6,Math.min(6,before+delta));
  let diff=stages[stat]-before;
  if(!diff){battle.log.push(`${target.name}の${STAGE_LABELS[stat]}は もう${delta>0?'上がらない':'下がらない'}！`);continue}
  battle.log.push(`${target.name}の${STAGE_LABELS[stat]}が${Math.abs(diff)>=2?'ぐーんと':''}${diff>0?'上がった':'下がった'}！`);
 }
 return true
}
function damage(att,def,m){
 let atk=m.category==='physical'?effectiveStat(att,'attack'):effectiveStat(att,'special-attack');
 let dfs=m.category==='physical'?effectiveStat(def,'defense'):effectiveStat(def,'special-defense');
 let base=(((2*att.lv/5+2)*m.power*atk/Math.max(1,dfs))/50+2);
 return Math.max(1,Math.floor(base*(att.types.includes(m.type)?1.5:1)*eff(m,def)*(.85+Math.random()*.15)))
}
function attack(att,def,m){
 if(Math.random()*100>=hitChance(att,def,m)){battle.log.push(`${att.name}の ${m.name}！ しかし外れた！`);return}
 if(m.category==='status'){
  if(applyStage(att,def,m.slug,m.name))return;
  battle.log.push(`${att.name}の ${m.name}！ しかし効果がなかった！`);return
 }
 let mult=eff(m,def);
 if(mult===0){battle.log.push(`${att.name}の ${m.name}！ 効果がない…`);return}
 let n=damage(att,def,m);def.hp=Math.max(0,def.hp-n);
 battle.log.push(`${att.name}の ${m.name}！ ${n}ダメージ！${mult>1?' 効果はバツグン！':mult<1?' 効果はいまひとつ…':''}`);
 if(def.hp===0)battle.log.push(`${def.name}は倒れた！`)
}
function battleSpeed(p){return effectiveStat(p,'speed')}
function resetStages(p){p.stages=Object.fromEntries(STAGE_KEYS.map(k=>[k,0]))}
function nextAlive(arr){return arr.findIndex(p=>p.hp>0)}
function endCheck(){if(activeMon('enemies').hp<=0){let n=nextAlive(battle.enemies);if(n<0){winBattle();return true}battle.ei=n;resetStages(activeMon('enemies'));battle.log.push(`${battle.boss.name}は ${activeMon('enemies').name}をくりだした！`)}if(activeMon('allies').hp<=0){let n=nextAlive(battle.allies);if(n<0){loseBattle();return true}battle.ai=n;resetStages(activeMon('allies'));battle.log.push(`${state.player}は ${activeMon('allies').name}をくりだした！`)}return false}
function playerAttack(i){if(!battle||battle.busy)return;let a=activeMon('allies'),e=activeMon('enemies'),m=a.moves[i];if(!m)return;battle.busy=true;let em=e.moves[Math.floor(Math.random()*e.moves.length)],first= battleSpeed(a)>battleSpeed(e)||(battleSpeed(a)===battleSpeed(e)&&Math.random()<.5);if(first){attack(a,e,m);if(!endCheck()&&e.hp>0)attack(e,a,em)}else{attack(e,a,em);if(!endCheck()&&a.hp>0)attack(a,e,m)}if(battle){if(!endCheck()){battle.turn++;battle.busy=false}render()}}
function switchPoke(i){if(!battle||battle.busy||battle.allies[i]?.hp<=0)return;resetStages(activeMon('allies'));battle.ai=i;battle.log.push(`${state.player}は ${activeMon('allies').name}に交代した！`);let e=activeMon('enemies'),a=activeMon('allies');attack(e,a,e.moves[Math.floor(Math.random()*e.moves.length)]);if(!endCheck()){battle.turn++;battle.busy=false}render()}
function retreat(){if(!confirm('ジム戦をやめる？ ペナルティはないよ。'))return;battle=null;render()}
function winBattle(){let b=battle.boss,idx=state.cleared;state.cleared++;state.energy+=b.lv*10;save();battle=null;tab='story';render();showModal(`<h2>🏆 ${b.name}に勝利！</h2><div class="flair">🏅</div><p><b>${b.badge}</b>を手に入れた！<br>勝利報酬：${b.lv*10} ポケエネ！</p><div class="notice">放置収益が <b>${INCOME[idx]} → ${INCOME[idx+1]} エネ/時</b> にアップ！<br>${EGG[idx+1]?.name||'次の冒険'}が解放された！</div><button class="btn wide" style="margin-top:13px" onclick="closeModal()">次の冒険へ！</button>`)}
function loseBattle(){let b=battle.boss;battle=null;render();showModal(`<h2>また挑戦しよう！</h2><p>${b.name}には負けてしまった…。<br>でもペナルティはなし！</p><p>ポケエネをためて、ポケモンを育ててから再挑戦しよう。</p><button class="btn wide" onclick="closeModal()">育成にもどる</button>`)}
window.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t)changeTab(t.dataset.tab)});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!battle)render()});window.addEventListener('focus',()=>{if(!battle&&state.step>=3)render()});render();
</script></body></html>
